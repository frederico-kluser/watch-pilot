[project]
name = "watch-pilot-hub"
version = "0.1.0"
description = "FastAPI hub for the Watch Pilot voice assistant (Mac mini M1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx[http2]>=0.27",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
