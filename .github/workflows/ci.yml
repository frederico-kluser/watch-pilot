# =============================================================================
# CI — watch-pilot
#
# The `build` job is the required status check for `main` (see
# .github/rulesets/regras-main.json), so its `name:` must stay exactly "build".
# Actions are pinned by SHA; run `bash scripts/oss-pin-actions.sh` after editing.
# =============================================================================

name: CI

on:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install hub dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart "httpx[http2]" pydantic pytest pytest-asyncio

      - name: Byte-compile (syntax gate)
        run: python -m compileall -q server/app scripts

      - name: Hub test suite
        working-directory: server
        run: python -m pytest -q

      - name: Shell syntax gate
        run: |
          for script in scripts/*.sh apps/mac-tools/build.sh; do
            bash -n "$script"
          done

      - name: Secret scan
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=.venv \
               -E "sk-or-v1-[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" .; then
            echo "::error::possible secret committed"
            exit 1
          fi
          echo "no obvious secrets"

  swift:
    name: swift
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: apps/watch
        run: xcodegen generate --spec project.yml

      - name: Compile the watch app (unsigned)
        run: |
          # Build only: needs an SDK, not a simulator runtime.
          SDK="$(xcodebuild -showsdks | grep -oE 'watchos[0-9.]+' | head -1)"
          echo "using sdk: $SDK"
          xcodebuild -project apps/watch/WatchPilot.xcodeproj \
            -scheme WatchPilot -sdk "$SDK" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Compile the transcription CLI
        run: bash apps/mac-tools/build.sh "$RUNNER_TEMP/bin"
